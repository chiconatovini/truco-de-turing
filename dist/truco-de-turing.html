<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- empacotar:cabecalho -->
<title>Truco de Turing</title>
<meta name="description" content="Jogo de cartas para aprender redes neurais e deep learning, com alma de truco e Magic: The Gathering.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Spectral:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap">
<style>
/**
 * Estilo dos painéis HTML do Truco de Turing (menu, regras, grimório, conquistas, sobre, avisos).
 * A mesa em si é desenhada pelo Phaser no canvas; aqui ficam só as telas sobrepostas.
 *
 * Paleta: mesa de truco à noite (feltro verde, latão, pergaminho) e as cores azul/laranja
 * do TensorFlow Playground para as duas redes.
 */
:root {
  /* layout: canvas do Phaser ocupando a tela + painéis HTML sobrepostos para menus e regras */
  --feltro: #0f3b2a;
  --feltro-escuro: #08241a;
  --madeira: #22130a;
  --latao: #d9b260;
  --latao-suave: #a88843;
  --pergaminho: #efe3c6;
  --pergaminho-escuro: #d9c7a0;
  --tinta: #24170c;
  --azul: #4aa3df;
  --laranja: #f59322;
  --vinho: #7a1626;
  --fonte-titulo: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --fonte-texto: 'Spectral', Georgia, 'Times New Roman', serif;
  --fonte-interface: 'Spectral', Georgia, 'Times New Roman', serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(ellipse at 50% 40%, #12382a 0%, #071810 70%, #040c08 100%);
  background-color: var(--feltro-escuro);
  color: var(--pergaminho);
  font-family: var(--fonte-interface);
  font-variant-numeric: lining-nums;
  overflow: hidden;
}
/* O Phaser mede o contêiner com getBoundingClientRect (que inclui padding): por isso as áreas
 * seguras (entalhe, barra de gestos) entram como posição, nunca como padding. */
#jogo {
  position: fixed;
  top: env(safe-area-inset-top, 0px);
  right: env(safe-area-inset-right, 0px);
  bottom: env(safe-area-inset-bottom, 0px);
  left: env(safe-area-inset-left, 0px);
  overflow: hidden;
}
#jogo canvas { display: block; touch-action: none; }
html, body { overscroll-behavior: none; }

/* ---------- Painéis sobrepostos ---------- */
#paineis { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
.camada {
  position: absolute; inset: 0;
  display: flex; overflow-y: auto;
  padding-block: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(4, 10, 7, 0.72);
  pointer-events: auto;
  animation: surgir 0.18s ease-out;
}
.camada > * { margin: auto; }
.camada.transparente { background: transparent; }
@keyframes surgir { from { opacity: 0; } to { opacity: 1; } }
@keyframes subir { from { transform: translateY(14px); opacity: 0.4; } to { transform: none; opacity: 1; } }

.folha {
  position: relative;
  width: min(880px, 100%);
  max-height: 100%;
  overflow: auto;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0) 120px),
    var(--pergaminho);
  color: var(--tinta);
  border: 3px solid #0d0a08;
  outline: 2px solid var(--latao);
  outline-offset: -9px;
  border-radius: 14px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
  padding: 28px 30px 26px;
  font-family: var(--fonte-texto);
  font-size: 17px;
  line-height: 1.5;
  animation: subir 0.22s ease-out;
}
.folha.estreita { width: min(520px, 100%); }
.folha h1, .folha h2, .folha h3 { font-family: var(--fonte-titulo); text-wrap: balance; color: #2b1608; margin: 0; }
.folha h2 { font-size: 28px; letter-spacing: 0.02em; }
.folha h3 { font-size: 17px; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 18px; color: #6b1a22; }
.folha p { margin: 8px 0; max-width: 68ch; }
.folha ul { margin: 6px 0; padding-left: 20px; }
.folha li { margin: 3px 0; }
.folha kbd, .selo {
  display: inline-block; font-family: var(--fonte-interface); font-weight: 700; font-size: 13px;
  padding: 1px 8px; border-radius: 999px; background: #2b1608; color: var(--pergaminho);
}
.selo.azul { background: #1f5f8a; }
.selo.laranja { background: #a8580c; }
.fechar-x {
  position: absolute; top: 12px; right: 14px;
  width: 36px; height: 36px; border-radius: 50%;
  border: 2px solid #2b1608; background: transparent; color: #2b1608;
  font: 700 20px var(--fonte-interface); cursor: pointer;
}
.fechar-x:hover { background: #2b1608; color: var(--pergaminho); }

.botao {
  font-family: var(--fonte-titulo); font-weight: 700; letter-spacing: 0.06em;
  font-size: 16px; padding: 11px 20px; border-radius: 10px; cursor: pointer;
  border: 2px solid #0d0a08;
  background: linear-gradient(180deg, #f3d488, #c79a3a);
  color: #24140a;
  box-shadow: 0 3px 0 #6b4a12, 0 8px 18px rgba(0, 0, 0, 0.35);
  transition: transform 0.08s ease, filter 0.15s ease;
}
.botao:hover { filter: brightness(1.08); }
.botao:active { transform: translateY(2px); box-shadow: 0 1px 0 #6b4a12; }
.botao.vinho { background: linear-gradient(180deg, #b0303d, #6e1420); color: #ffe9d6; box-shadow: 0 3px 0 #3a0a10, 0 8px 18px rgba(0, 0, 0, 0.35); }
.botao.discreto { background: transparent; color: #2b1608; box-shadow: none; }
.botao.pequeno { font-size: 13px; padding: 7px 12px; }
.botao:focus-visible, select:focus-visible, .grimorio-lista button:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; }
.linha { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
/* janelas REGRAS e MENU da mesa: botões grandes, quase quadrados, em grade 2×2 */
.janela-da-mesa { width: min(440px, 100%); }
.grade-de-botoes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.grade-de-botoes .botao { min-height: 72px; padding: 10px 8px; font-size: 17px; }
.grade-de-botoes .botao.discreto { border-color: rgba(43, 22, 8, 0.45); }
@media (max-height: 520px) {
  .janela-da-mesa p { display: none; }
  .grade-de-botoes .botao { min-height: 60px; }
}
.linha.fim { justify-content: flex-end; }

/* ---------- Menu ---------- */
.menu {
  width: min(1040px, 100%);
  margin: auto; /* centraliza na tela, na horizontal e na vertical */
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  gap: 22px;
  align-items: center;
}
.menu-capa { display: flex; flex-direction: column; justify-content: center; gap: 14px; color: var(--pergaminho); min-width: 0; }
.menu-capa h1 {
  font-family: var(--fonte-titulo); font-weight: 900; margin: 0;
  font-size: clamp(42px, 6.4vw, 82px); line-height: 0.95; letter-spacing: 0.01em;
  color: #f6dc8f;
  text-shadow: 0 2px 0 #6b4a12, 0 4px 0 #3d2a08, 0 18px 40px rgba(0, 0, 0, 0.6);
  text-wrap: balance;
}
.menu-capa h1 span { display: block; font-size: 0.42em; letter-spacing: 0.3em; color: var(--latao); text-shadow: none; margin-bottom: 6px; }
.menu-capa p { font-family: var(--fonte-texto); font-size: 19px; line-height: 1.45; max-width: 46ch; margin: 0; color: #e9dcbc; }
.legenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: #cdbf9e; }
.legenda b { color: var(--pergaminho); }
.ponto { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.menu-acoes { display: grid; gap: 10px; margin-top: 6px; max-width: 520px; }
.menu-acoes .botao.jogar { font-size: 20px; padding: 12px 20px; letter-spacing: 0.12em; }
.menu-mais { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.menu-mais .botao { font-size: 13px; padding: 9px 6px; white-space: nowrap; }
@media (max-width: 520px) { .menu-mais { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.menu-painel { padding: 22px 24px; }
.campo { display: grid; gap: 4px; margin-bottom: 12px; }
.campo label { font-family: var(--fonte-interface); font-weight: 700; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #6b1a22; }
.campo select {
  font: 600 16px var(--fonte-interface); color: var(--tinta);
  background: #fbf4e2; border: 2px solid #2b1608; border-radius: 8px; padding: 8px 10px; width: 100%;
}
.campo .dica { font-size: 14px; color: #5a4630; line-height: 1.35; min-width: 0; }
/* seletor com a miniatura (verso do baralho, mesa do terreno) ao lado, na mesma linha */
.campo-linha { display: flex; gap: 10px; align-items: center; }
.campo-linha select { flex: 1; min-width: 0; }
/* caixa de largura fixa: os dois seletores terminam no mesmo ponto e a miniatura fica centralizada */
.campo-linha .miniatura { margin-inline: calc((66px - var(--largura-miniatura)) / 2); }
.miniatura { flex: none; display: block; border-radius: 5px; overflow: hidden; border: 1.5px solid #2b1608; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3); background: #2b1608; }
.miniatura img { display: block; width: 100%; height: 100%; object-fit: cover; }
.miniatura.verso { --largura-miniatura: 30px; width: 30px; height: 42px; border: 0; border-radius: 3px; background: transparent; }
.miniatura.mesa { --largura-miniatura: 66px; width: 66px; height: 38px; }
.creditos { font-size: 13px; color: #a8987a; line-height: 1.4; }
.creditos a { color: var(--latao); }

/* ---------- Grimório ---------- */
.grimorio { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; margin-top: 14px; }
.grimorio-lista { display: grid; gap: 4px; align-content: start; }
.grimorio-lista button {
  text-align: left; font: 600 15px var(--fonte-interface); color: var(--tinta);
  background: transparent; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer;
}
.grimorio-lista button[aria-current='true'] { background: #2b1608; color: var(--pergaminho); }
.grimorio-lista button .lido { font-size: 11px; color: #8a6d3a; margin-left: 6px; }
.grimorio-verbete { min-width: 0; }
.grimorio-verbete .categoria { font: 700 12px var(--fonte-interface); letter-spacing: 0.16em; text-transform: uppercase; color: #6b1a22; }
.grimorio-verbete .no-jogo { border-left: 4px solid var(--azul); background: rgba(74, 163, 223, 0.1); padding: 10px 14px; border-radius: 0 8px 8px 0; }

/* ---------- Conquistas ---------- */
.folha.larga { width: min(1060px, 100%); }
.conquistas-salao { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 24px; align-items: start; }
.guilda { text-align: center; position: sticky; top: 0; }
.guilda .retrato { aspect-ratio: 240 / 330; max-width: 230px; margin: 0 auto; }
.guilda .retrato canvas { width: 100%; height: auto; display: block; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.35)); }
.guilda-nota { font-style: italic; font-size: 14px; color: #5a4630; margin: 6px auto 0; max-width: 26ch; }
.conquistas-principal { min-width: 0; }
.conquistas-resumo { color: #5a4630; }
.conquistas-resumo b { font-family: var(--fonte-titulo); font-size: 20px; color: #6b1a22; }
.conquistas-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-top: 12px; }
.conquista {
  display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 12px; align-items: center;
  padding: 10px; border-radius: 10px; border: 1px solid rgba(43, 22, 8, 0.25); background: rgba(255, 255, 255, 0.38);
}
.medalha {
  position: relative; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0) 55%), var(--graduacao);
  border: 2px solid #24140a; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.25), 0 3px 8px rgba(0, 0, 0, 0.25);
}
.medalha > svg { width: 38px; height: 38px; }
.medalha .cadeado { position: absolute; right: -4px; bottom: -4px; width: 22px; height: 22px; border-radius: 50%; background: #efe3c6; border: 1.5px solid #24140a; display: grid; place-items: center; }
.medalha .cadeado svg { width: 16px; height: 16px; }
.conquista.bloqueada .medalha { background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0) 55%), #c9bc9f; }
.conquista.bloqueada .medalha > svg { filter: grayscale(1); opacity: 0.4; }
.conquista.bloqueada b, .conquista.bloqueada .graduacao { opacity: 0.65; }
.conquista b { display: block; font-family: var(--fonte-interface); font-size: 15px; }
.conquista small { display: block; font-family: var(--fonte-interface); font-size: 13px; color: #5a4630; line-height: 1.3; }
.conquista .graduacao { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #6b1a22; font-weight: 700; }
.conquistas-rodape { font-size: 13px; color: #7a6a4c; margin-top: 12px; }
.desbloqueio .medalha { width: 38px; height: 38px; flex: none; }
.desbloqueio .medalha > svg { width: 26px; height: 26px; }
.folha.sobre h3:first-of-type { margin-top: 14px; }
.folha.sobre a { color: #7a1626; }
.folha.sobre .versao { margin-top: -6px; font-family: var(--fonte-interface); font-size: 13px; letter-spacing: 0.04em; color: #7a6a4c; }
.folha.sobre .autores { font-weight: 600; margin-bottom: 0; }
.folha.sobre .contribuicoes { font-size: 13px; font-style: italic; color: #7a6a4c; margin-top: 10px; }

/* ---------- Fim de mão ---------- */
.resultado-grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 12px; }
.rede { border-radius: 10px; padding: 12px 14px; background: rgba(255, 255, 255, 0.4); border-top: 6px solid var(--azul); min-width: 0; }
.rede.j1 { border-top-color: var(--laranja); }
.rede .total { font: 900 40px var(--fonte-titulo); line-height: 1; }
.rede .situacao { font: 700 12px var(--fonte-interface); letter-spacing: 0.14em; text-transform: uppercase; color: #6b1a22; }
.termos { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.termo { font: 600 13px var(--fonte-interface); background: #fbf4e2; border: 1px solid #c9b48a; border-radius: 6px; padding: 2px 7px; }
.termo.combo { background: #2b1608; color: #f6dc8f; border-color: #2b1608; }
.termo.ruim { background: #6e1420; color: #ffe1d6; border-color: #6e1420; }
.tentos { font: 700 18px var(--fonte-interface); margin-top: 12px; }
.tentos .grande { font: 900 30px var(--fonte-titulo); }
.desbloqueios { margin-top: 10px; display: grid; gap: 6px; }
.desbloqueio { display: flex; gap: 10px; align-items: center; font: 600 15px var(--fonte-interface); }

/* ---------- Truco ---------- */
.grito-truco { text-align: center; }
.grito-truco .grito {
  font: 900 64px var(--fonte-titulo); color: #8a1222; letter-spacing: 0.04em; line-height: 1;
  text-shadow: 0 3px 0 #f6dc8f;
}
.grito-truco .quem { font: 700 14px var(--fonte-interface); letter-spacing: 0.2em; text-transform: uppercase; color: #6b1a22; }
.grito-truco .linha { justify-content: center; margin-top: 16px; }

/* ---------- Avisos rápidos ---------- */
#avisos {
  position: fixed; top: max(10px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  display: grid; gap: 6px; z-index: 9; pointer-events: none; width: min(440px, calc(100% - 32px));
}
.aviso {
  pointer-events: auto;
  background: var(--pergaminho); color: var(--tinta); border: 2px solid #0d0a08; border-radius: 10px;
  padding: 8px 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); font-family: var(--fonte-texto); font-size: 14px; line-height: 1.35;
  animation: subir 0.25s ease-out;
}
.aviso b { font-family: var(--fonte-titulo); font-size: 14px; display: block; color: #6b1a22; letter-spacing: 0.04em; }
.aviso.medalha-aviso { border-color: var(--latao); background: #2b1608; color: #f6dc8f; }
.aviso.medalha-aviso b { color: var(--latao); }
.aviso.dica-de-jogo { border-color: var(--latao); }
.aviso.dica-de-jogo .conceito { display: block; margin-top: 6px; padding-top: 6px; border-top: 1px dashed rgba(60, 40, 20, 0.35); font-size: 13px; color: #4b3a26; }

/* ---------- Vitória: tela de resultado em festa ---------- */
.folha.vitoria {
  border-color: var(--latao);
  box-shadow: 0 0 0 3px rgba(217, 178, 96, 0.55), 0 0 60px rgba(246, 220, 143, 0.45), 0 30px 80px rgba(0, 0, 0, 0.6);
  animation: surgir 0.3s ease-out, brilhar-vitoria 2.4s ease-in-out infinite;
}
.folha.vitoria h2 {
  font-size: clamp(26px, 4vw, 38px); text-align: center;
  background: linear-gradient(180deg, #fff1b8 0%, #e7b23a 45%, #8a5a10 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 rgba(58, 36, 6, 0.6));
}
.folha.vitoria > p:first-of-type { text-align: center; }
.folha.campeao h2 { font-size: clamp(28px, 4.6vw, 44px); }
.trofeu { display: flex; justify-content: center; margin: -4px 0 2px; animation: pulo-trofeu 1.2s ease-in-out infinite; }
.folha.campeao .trofeu svg { width: 96px; height: 96px; }
.sem-conquistas { font-style: italic; color: #7a6a4c; font-size: 14px; }
@keyframes brilhar-vitoria { 50% { box-shadow: 0 0 0 3px rgba(217, 178, 96, 0.85), 0 0 90px rgba(246, 220, 143, 0.7), 0 30px 80px rgba(0, 0, 0, 0.6); } }
@keyframes pulo-trofeu { 50% { transform: translateY(-6px) rotate(-3deg); } }

/* ---------- Revisão da mão ---------- */
.revisao .introducao { margin-top: 0; }
.revisao .resumo { padding-left: 18px; }
.revisao .resumo li { margin: 4px 0; }
.revisao .resumo li[style] { list-style: none; margin-left: -18px; padding-left: 10px; border-left: 4px solid var(--cor); }
.curva-svg { width: 100%; height: auto; background: #f7efdb; border: 1px solid #cdb98e; border-radius: 10px; }
.curva-svg .grade { stroke: rgba(60, 40, 20, 0.15); }
.curva-svg .eixo { font: 11px var(--fonte-texto); fill: #7a6a4c; }
.curva-svg .linha-truco { stroke: var(--vinho); stroke-width: 2; stroke-dasharray: 5 4; }
.curva-svg .marca text { font: 700 9.5px var(--fonte-texto); fill: #fff; pointer-events: none; }
.curva-svg .marca { cursor: help; }
.curva-legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 13px; }
.curva-legenda i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.curva-legenda i.redonda { width: 11px; height: 11px; border-radius: 50%; }
.dica-grafico { font-size: 13px; font-style: italic; color: #7a6a4c; }
.linha-do-tempo { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.linha-do-tempo li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; padding: 7px 10px; border-radius: 8px; background: rgba(255, 255, 255, 0.45); border-left: 4px solid var(--cor); font-size: 14.5px; }
.linha-do-tempo .numero { font: 700 13px var(--fonte-titulo); color: var(--cor); text-align: center; padding-top: 2px; }
.linha-do-tempo .tipo { display: inline-block; color: #fff; font: 700 10.5px var(--fonte-titulo); letter-spacing: 0.04em; padding: 2px 7px; border-radius: 99px; vertical-align: 1px; }
.linha-do-tempo .variacoes { white-space: nowrap; }
.linha-do-tempo .variacao { display: inline-block; font-weight: 700; font-size: 12.5px; padding: 0 6px; border-radius: 6px; margin-left: 4px; color: var(--cor); background: rgba(0, 0, 0, 0.05); }
.linha-do-tempo .variacao.desce { text-decoration: underline wavy rgba(208, 40, 60, 0.6); }
.conceito-passo { margin-top: 5px; font-size: 13px; font-style: italic; color: #4b3a26; }
.tabela-partida { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.tabela-partida th, .tabela-partida td { text-align: left; padding: 6px 8px; border-bottom: 1px solid rgba(60, 40, 20, 0.15); }
.tabela-partida th { font: 700 11px var(--fonte-titulo); letter-spacing: 0.06em; color: #6b1a22; }

/* Dica flutuante dos botões da mesa (modo "dicas"), no estilo dos avisos do Grimório */
.dica-flutuante {

  function abrirRegras(app, aoFechar) {
    const html = '<div class="folha"><button class="fechar-x" data-fechar aria-label="Fechar">\xD7</button><h2>Como jogar</h2><p>Dois jogadores disputam quem constr\xF3i a rede neural de maior soma, ligando a <b>camada de entrada</b> \xE0 <b>camada de sa\xEDda</b> com um neur\xF4nio em cada uma das 5 camadas ocultas. A sua rede \xE9 <span class="selo azul">azul</span>, a do advers\xE1rio \xE9 <span class="selo laranja">laranja</span>.</p><h3>Prepara\xE7\xE3o</h3><ul><li>Baralho de 52 cartas, sem coringas. Na mesa, viradas: 3 na entrada, 5 em cada uma das 5 camadas ocultas e 4 na sa\xEDda.</li><li>Cada jogador recebe 5 cartas na m\xE3o. Elas <b>n\xE3o s\xE3o repostas</b>: s\xE3o seu estoque de a\xE7\xF5es para a m\xE3o inteira.</li><li>As 10 restantes v\xE3o para o <b>limbo</b> sem serem vistas (ru\xEDdo).</li></ul><h3>Seu turno</h3><p>Fa\xE7a uma destas coisas: <b>ative um neur\xF4nio</b> virado na pr\xF3xima camada da sua rede (clique nele), ou use cartas da m\xE3o numa a\xE7\xE3o. Cada neur\xF4nio pertence a um s\xF3 jogador. S\xF3 pode passar quem n\xE3o tem neur\xF4nio para ativar.</p><h3>Pontua\xE7\xE3o</h3><ul><li>2 a 10 valem o n\xFAmero, \xC1s vale 11, J, Q e K valem 0.</li><li>Figuras iguais em camadas vizinhas: par vale +10, trio +20. Quatro figuras iguais seguidas (contando as empilhadas) causam <b>vanishing gradient</b> e zeram a rede.</li></ul><h3>A\xE7\xF5es com a m\xE3o</h3><p>Selecione cartas da m\xE3o de mesma figura do neur\xF4nio e clique no alvo. Entrada e sa\xEDda s\xE3o imunes. O alvo \xE9 sempre o neur\xF4nio oculto mais recente de uma rede.</p><ul><li><b>Tunagem</b> (1 carta no seu neur\xF4nio): a carta soma \xE0 rede; em figuras, +10.</li><li><b>Overfit</b> (1 carta no neur\xF4nio do advers\xE1rio): o neur\xF4nio vai para o cemit\xE9rio e a rede dele recua uma camada.</li><li><b>Early stop</b> (o neur\xF4nio fica com 3 cartas): a rede atingida \xE9 finalizada na hora.</li><li><b>Stack overflow</b> (4 cartas): early stop e a v\xEDtima perde a m\xE3o inteira.</li><li><b>Dropout / GatoNet</b>: desvire seus \xFAltimos neur\xF4nios ocultos pagando 1 carta por camada. N\xE3o gasta o turno.</li><li><b>Transfer learning</b>: com quatro cartas iguais na m\xE3o, troque-as por quatro do limbo (uma vez por m\xE3o).</li></ul><p>Exemplo do enunciado: a rede 8-K-K-3 com tunagem num K soma 8 + (trio de Reis 20) + (tunagem 10) + 3 = <b>41</b>.</p><h3>Fim da m\xE3o e desempates</h3><p>A m\xE3o acaba quando todas as redes est\xE3o finalizadas (chegaram \xE0 sa\xEDda, ou sofreram early stop ou stack overflow) ou quando todos passam em seguida. Vence a maior soma. Empate: menos dropouts; depois a maior soma das melhores cartas da m\xE3o; depois a carta mais alta (espadas &gt; copas &gt; paus &gt; ouros); por fim, quem jogou primeiro.</p><h3>Truco</h3><p>Na partida at\xE9 12 tentos cada m\xE3o vale 1. Na sua vez, pe\xE7a <b>TRUCO</b> (3). O outro aceita, corre (voc\xEA leva o valor atual) ou aumenta: SEIS, NOVE, DOZE. Com algu\xE9m a um tento da vit\xF3ria \xE9 <b>m\xE3o de onze</b> e ningu\xE9m truca.</p><h3>Baralhos e terrenos</h3>' + listaDeExtensoes() + '<div class="linha fim" style="margin-top:14px"><button class="botao" data-fechar>Entendi</button></div></div>';
    if (app) {
      app.progresso.tutorialVisto = true;
      app.salvar();
    }
    return abrirPainel(html, { fechaAoClicarFora: true, aoFechar });
  }

  // src/interface/telas/grimorio.js
  function abrirGrimorio(app, idInicial, aoFechar) {
    const html = '<div class="folha"><button class="fechar-x" data-fechar aria-label="Fechar">\xD7</button><h2>Grim\xF3rio de conceitos</h2><p>Cada mec\xE2nica do jogo \xE9 um conceito de aprendizado de m\xE1quina. Os verbetes aparecem destacados quando acontecem na mesa.</p><div class="grimorio"><nav class="grimorio-lista" id="g-lista"></nav><article class="grimorio-verbete" id="g-verbete"></article></div></div>';
    const painel = abrirPainel(html, { fechaAoClicarFora: true, aoFechar });
    const lista = painel.elemento.querySelector("#g-lista");
    const artigo = painel.elemento.querySelector("#g-verbete");
    function desenharLista(ativo) {
      lista.innerHTML = VERBETES.map((v) => '<button data-id="' + v.id + '" aria-current="' + (v.id === ativo) + '">' + escaparHtml(v.titulo) + (app.progresso.lidos[v.id] ? '<span class="lido">lido</span>' : "") + "</button>").join("");
      lista.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => mostrar(b.dataset.id)));
    }
    function mostrar(id) {
      const v = VERBETES.find((x) => x.id === id) || VERBETES[0];
      app.marcarVerbeteLido(v.id);
      artigo.innerHTML = '<div class="categoria">' + escaparHtml(v.categoria) + "</div><h2>" + escaparHtml(v.titulo) + "</h2><p>" + escaparHtml(v.conceito) + '</p><p class="no-jogo"><b>No jogo:</b> ' + escaparHtml(v.noJogo) + "</p>";
      desenharLista(v.id);
    }
    mostrar(idInicial || VERBETES[0].id);
    return painel;
  }

    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function arcoGotico(ctx, x, y, w, h) {
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.lineTo(x, y + w * 0.55);
    ctx.quadraticCurveTo(x, y, x + w / 2, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + w * 0.55);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
  }
  function dourado(ctx, x0, y0, x1, y1) {
    let g = ctx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, "#fff3c4");
    g.addColorStop(0.25, "#d6a23a");
    g.addColorStop(0.5, "#fff1b0");
    g.addColorStop(0.75, "#a87516");
    g.addColorStop(1, "#f6dc8f");

  function desenharRetratoEmMoldura(src, S, nome, titulo, pronto) {

    c.height = Math.round(H * S);

    ctx.scale(S, S);
    let img = new Image();
    img.onload = function() {
      let stone = ctx.createLinearGradient(0, 0, 0, H);
      stone.addColorStop(0, "#5b4a36");
      stone.addColorStop(1, "#2c2116");
      ctx.fillStyle = stone;
      caminhoArredondado2(ctx, 6, 14, W - 12, H - 40, 14);

      ctx.strokeStyle = "#0d0a08";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 3;

      ctx.fillStyle = dourado(ctx, ax, ay, ax + aw, ay + ah);

      ctx.restore();
      ctx.strokeStyle = "#3d2a08";
      ctx.lineWidth = 1.6;
      arcoGotico(ctx, ax - 14, ay - 14, aw + 28, ah + 28);
      ctx.stroke();
      ctx.fillStyle = "#fff6c8";
      for (let i = 0; i < 26; i++) {
        let t = i / 25, px, py;
        if (t < 0.3) {
          px = ax - 7;
          py = ay + ah - t / 0.3 * (ah - aw * 0.45);
        } else if (t > 0.7) {
          px = ax + aw + 7;
          py = ay + aw * 0.45 + (t - 0.7) / 0.3 * (ah - aw * 0.45);
        } else {
          let a = Math.PI + (t - 0.3) / 0.4 * Math.PI;
          px = ax + aw / 2 + Math.cos(a) * (aw / 2 + 7);
          py = ay + aw * 0.5 + Math.sin(a) * (aw * 0.5 + 7);

        ctx.beginPath();
        ctx.arc(px, py, 1.7, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.save();
      arcoGotico(ctx, ax, ay, aw, ah);
      ctx.clip();
      let side = Math.min(img.width, img.height);
      let scale = Math.max(aw / side, ah / side);
      let dw = side * scale, dh = side * scale;
      ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, ax + (aw - dw) / 2, ay + (ah - dh) / 2 + 6, dw, dh);
      let v = ctx.createRadialGradient(ax + aw / 2, ay + ah * 0.45, ah * 0.25, ax + aw / 2, ay + ah / 2, ah * 0.75);
      v.addColorStop(0, "rgba(60,30,0,0)");
      v.addColorStop(1, "rgba(40,20,0,.55)");
      ctx.fillStyle = v;
      ctx.fillRect(ax, ay, aw, ah);
      ctx.restore();
      ctx.strokeStyle = "#3d2a08";
      ctx.lineWidth = 2;
      arcoGotico(ctx, ax, ay, aw, ah);
      ctx.stroke();
      ctx.save();
      ctx.translate(W / 2, ay - 12);
      ctx.fillStyle = "#7a1626";
      ctx.strokeStyle = "#3d2a08";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(-14, -12);
      ctx.lineTo(14, -12);
      ctx.lineTo(14, 2);
      ctx.quadraticCurveTo(14, 14, 0, 18);
      ctx.quadraticCurveTo(-14, 14, -14, 2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = "#f2c94c";
      ctx.lineWidth = 1.2;
      [[-7, -5], [0, -5], [7, -5], [-4, 4], [4, 4]].forEach(function(p, k, arr) {
        if (k < 3) {
          ctx.beginPath();
          ctx.moveTo(p[0], p[1]);
          ctx.lineTo(-4, 4);
          ctx.moveTo(p[0], p[1]);
          ctx.lineTo(4, 4);
          ctx.stroke();
        }
      });
      ctx.fillStyle = "#4aa3df";
      [[-7, -5], [0, -5], [7, -5]].forEach(function(p) {
        ctx.beginPath();
        ctx.arc(p[0], p[1], 2.2, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.fillStyle = "#f59322";
      [[-4, 4], [4, 4]].forEach(function(p) {
        ctx.beginPath();
        ctx.arc(p[0], p[1], 2.2, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
      let ry = ay + ah + 20;
      ctx.fillStyle = "#5a0e1a";
      ctx.beginPath();
      ctx.moveTo(4, ry - 4);
      ctx.lineTo(24, ry - 4);
      ctx.lineTo(24, ry + 22);
      ctx.lineTo(4, ry + 22);
      ctx.lineTo(12, ry + 9);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(W - 4, ry - 4);
      ctx.lineTo(W - 24, ry - 4);
      ctx.lineTo(W - 24, ry + 22);
      ctx.lineTo(W - 4, ry + 22);
      ctx.lineTo(W - 12, ry + 9);
      ctx.closePath();
      ctx.fill();
      let rib = ctx.createLinearGradient(0, ry - 8, 0, ry + 28);
      rib.addColorStop(0, "#c0303e");
      rib.addColorStop(1, "#7a1626");
      ctx.fillStyle = rib;
      ctx.strokeStyle = "#2a0508";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(18, ry - 10);
      ctx.quadraticCurveTo(W / 2, ry - 18, W - 18, ry - 10);
      ctx.lineTo(W - 18, ry + 18);
      ctx.quadraticCurveTo(W / 2, ry + 10, 18, ry + 18);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#fff1c8";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      let fs = 15;
      ctx.font = "700 " + fs + "px Cinzel, Georgia, serif";
      while (ctx.measureText(nome).width > W - 60 && fs > 9) {
        fs -= 0.5;
        ctx.font = "700 " + fs + "px Cinzel, Georgia, serif";
      }
      ctx.fillText(nome, W / 2, ry + 1);
      ctx.fillStyle = "#e8d6a8";
      ctx.font = "italic 500 11.5px Spectral, Georgia, serif";
      ctx.fillText(titulo, W / 2, ry + 36);
      pronto(c);
    };
    img.src = src;
  }

  // src/interface/telas/conquistas.js
  function medalhaHtml(conquista, desbloqueada) {
    const cor = GRADUACOES[conquista.graduacao].cor;
    return '<div class="medalha" style="--graduacao:' + cor + '">' + (ICONES_CONQUISTAS[conquista.id] || "") + (desbloqueada ? "" : '<span class="cadeado">' + ICONE_CADEADO + "</span>") + "</div>";
  }
  function itemHtml(conquista, desbloqueada) {
    return '<div class="conquista' + (desbloqueada ? "" : " bloqueada") + '">' + medalhaHtml(conquista, desbloqueada) + '<div><span class="graduacao">' + GRADUACOES[conquista.graduacao].nome + "</span><b>" + escaparHtml(conquista.nome) + "</b><small>" + escaparHtml(conquista.descricao) + "</small></div></div>";
  }
  function abrirConquistas(app) {
    const p = app.progresso;
    const total = CONQUISTAS.filter((c) => p.desbloqueadas[c.id]).length;
    const html = '<div class="folha larga"><button class="fechar-x" data-fechar aria-label="Fechar">\xD7</button><div class="conquistas-salao"><aside class="guilda"><div class="retrato" id="c-retrato" role="img" aria-label="Retrato do prof. Peng Yaohao em moldura medieval"></div><p class="guilda-nota">Guardi\xE3o do sal\xE3o das conquistas. Cada medalha aqui foi conquistada contra os oponentes da mesa.</p></aside><div class="conquistas-principal"><h2>Conquistas</h2><p class="conquistas-resumo"><b>' + total + "</b> de " + CONQUISTAS.length + " desbloqueadas \xB7 " + p.vitorias + " m\xE3os vencidas \xB7 " + p.dropouts + ' dropouts</p><div class="conquistas-lista">' + CONQUISTAS.map((c) => itemHtml(c, !!p.desbloqueadas[c.id])).join("") + '</div><p class="conquistas-rodape">Contam nas partidas contra os oponentes do computador.</p></div></div></div>';
    const painel = abrirPainel(html, { fechaAoClicarFora: true });
    const densidade = Math.min(3, Math.max(2, globalThis.devicePixelRatio || 1));
    desenharRetratoEmMoldura(FOTO_PROFESSOR, densidade, "Prof. Peng Yaohao", "Gr\xE3o-mestre da guilda", (canvas) => {
      painel.elemento.querySelector("#c-retrato")?.appendChild(canvas);
    });
    return painel;
  }

  // src/versao.js
  var VERSAO = "1.1.2";
  var DATA_DA_VERSAO = "2026-11-09";

  // src/interface/telas/sobre.js
  function abrirSobre() {
    const html = '<div class="folha sobre"><button class="fechar-x" data-fechar aria-label="Fechar">\xD7</button><h2>Sobre o Truco de Turing</h2><p class="versao">Vers\xE3o ' + VERSAO + " \xB7 " + DATA_DA_VERSAO.split("-").reverse().join("/") + ' \xB7 <a href="https://github.com/welyngton/truco-de-turing/blob/main/CHANGELOG.md" target="_blank" rel="noopener">hist\xF3rico de vers\xF5es</a></p><p>Um jogo de cartas para navegador que ensina redes neurais jogando. Cada carta \xE9 um neur\xF4nio, cada m\xE3o \xE9 uma rede constru\xEDda da entrada \xE0 sa\xEDda, e cada a\xE7\xE3o com as cartas (tunagem, overfit, dropout, early stop, transfer learning) \xE9 um conceito do treino de modelos. Por cima de tudo, o truco: tentos, pedidos de TRUCO, SEIS, NOVE e DOZE, e blefe.</p><h3>A disciplina</h3><p>Trabalho do tema 4 da disciplina FPO, semestre 2026/2, na Universidade de Bras\xEDlia, com o prof. Peng Yaohao. O tema pede um jogo indie para ensinar conceitos de machine learning e redes neurais, a partir de uma premissa: um jogo educativo precisa, antes de tudo, ser um jogo divertido. Se o jogo for divertido e o docente tiver compet\xEAncia suficiente, ele pode se tornar educativo.</p><h3>A especifica\xE7\xE3o</h3><ul><li>Mesa com um baralho de 52 cartas: 3 neur\xF4nios na entrada, 5 camadas ocultas de 5 neur\xF4nios e 4 na sa\xEDda. Cada jogador recebe 5 cartas; as 10 restantes v\xE3o para o limbo, como ru\xEDdo.</li><li>Os jogadores se alternam ativando neur\xF4nios para ligar a entrada \xE0 sa\xEDda. Vence a rede de maior soma: 2 a 10 pelo valor, \xC1s 11, figuras 0, com pares e trios de figuras vizinhas valendo b\xF4nus e quadras zerando a rede (vanishing gradient).</li><li>A\xE7\xF5es com a m\xE3o: tunagem, overfit, early stop, stack overflow, dropout (o GatoNet) e transfer learning. Entrada e sa\xEDda s\xE3o imunes.</li><li>Desempates em cascata e tr\xEAs formas de decidir quem come\xE7a.</li><li>Extens\xF5es propostas: baralhos com efeitos (truco, fraternidade, yin-yang, Power BI), terrenos (montanha, p\xE2ntano, oceano), coringas e conquistas em gradua\xE7\xF5es de bronze a antimat\xE9ria.</li><li>Inspira\xE7\xF5es citadas: TensorFlow Playground, Balatro, Magic: The Gathering e Geometry Dash.</li></ul><p>Esta vers\xE3o implementa todas as regras, os baralhos e os terrenos da especifica\xE7\xE3o, al\xE9m da camada de truco e de tr\xEAs oponentes. As leituras adotadas onde o texto deixa margem est\xE3o no README do projeto.</p><h3>O professor</h3><p><b>Peng Yaohao</b> \xE9 professor da Universidade de Bras\xEDlia, mestre e doutor pela UnB na \xE1rea de Finan\xE7as e M\xE9todos Quantitativos. Pesquisa aprendizado de m\xE1quina, modelos n\xE3o lineares e econometria financeira, com trabalhos sobre previs\xE3o de volatilidade e de pre\xE7os de a\xE7\xF5es e um estudo emp\xEDrico sobre n\xE3o linearidade e overfitting em machine learning com dados da COVID-19.</p><h3>Autores</h3><p class="autores">Welyngton Jos\xE9 Vinicius Dal Pr\xE1</p><p class="contribuicoes">Contribui\xE7\xF5es s\xE3o bem-vindas: o c\xF3digo est\xE1 aberto no reposit\xF3rio.</p><h3>Cr\xE9ditos e licen\xE7a</h3><p>C\xF3digo aberto sob a licen\xE7a <a href="https://github.com/welyngton/truco-de-turing#GPL-3.0-1-ov-file" target="_blank" rel="noopener">GPL-3.0</a>, no reposit\xF3rio <a href="https://github.com/welyngton/truco-de-turing" target="_blank" rel="noopener">github.com/welyngton/truco-de-turing</a>. Feito com Phaser 3; toda a arte das cartas \xE9 gerada por c\xF3digo; fontes Cinzel e Spectral.</p><div class="linha fim" style="margin-top:14px"><button class="botao" data-fechar>Fechar</button></div></div>';
    return abrirPainel(html, { fechaAoClicarFora: true });
  }

    montecarlo: "Mestre Monte Carlo \xB7 dif\xEDcil",
    guloso: "Gradiente Guloso \xB7 m\xE9dio",
    aleatorio: "Z\xE9 do Ru\xEDdo \xB7 f\xE1cil",
    doisHumanos: "2 humanos no mesmo aparelho"
  };
  var ESCOLHAS_INICIO = {
    "revela-volta": "Revela carta da m\xE3o (volta para a m\xE3o)",
    "revela-descarta": "Revela carta da m\xE3o (vai para o cemit\xE9rio)",
    sorteio: "Par ou \xEDmpar (sorteio)"
  };

  var miniaturas = {};
  function mostrarMiniatura(elemento, chave, desenhar) {
    if (!elemento) return;
    if (!miniaturas[chave]) {
      try {
        miniaturas[chave] = desenhar().toDataURL();
      } catch (e) {
        return;
      }
    }
    const img = elemento.querySelector("img") || elemento.appendChild(document.createElement("img"));
    img.alt = "";
    img.src = miniaturas[chave];
  }
  function opcoesHtml(rotulos, selecionado) {
    return Object.keys(rotulos).map((valor) => {
      const rotulo = typeof rotulos[valor] === "string" ? rotulos[valor] : rotulos[valor].nome;
      return '<option value="' + valor + '"' + (valor === String(selecionado) ? " selected" : "") + ">" + escaparHtml(rotulo) + "</option>";
    }).join("");

    /**

    /** Bloco de placar de um jogador: avatar, nome, nível, situação, detalhes, tentos e soma. */

    /** Brilho pulsante em volta do bloco de placar de quem está na vez (desenhado a cada quadro). */

    /** Habilita os botões conforme o que o jogador pode fazer agora. */

    /* ------------------------------------------------------------------ jogadas */

    executarJogada(jogada) {

      } catch (erro) {
        mostrarAviso("Jogada inv\xE1lida", erro.message);
        this.redesenhar();
        return;
      }
      this.selecao = [];
      if (this.modo !== "inicio") this.modo = "livre";

      this.redesenhar();
      this.anotarNaLinhaDoTempo(jogada, eventos);

    /** Decide o próximo passo: fim da mão, escolha de quem começa, vez do humano ou do oponente. */
    avancar() {

      const mao = this.mao;
      if (this.partida.pedido) return;
      if (mao.fase === "fim") return this.encerrarMao(null);
      if (mao.fase === "inicio") return this.avancarNoInicio();
      const vez = mao.vez, jogador = mao.jogadores[vez];
      if (jogador.tipo === "oponente") return this.vezDoOponente();

        this.avancar();
      });

      this.modo = "livre";

      const soPassar = jogadas.length === 1 && jogadas[0].tipo === "passar";

        this.ocupada = true;
        this.redesenhar();
        this.mostrarDica("Nenhuma jogada poss\xEDvel: passando a vez.");

      this.redesenhar();
    },
    /**
     * Guarda um passo da mão para a revisão didática do fim (interface/telas/revisao.js):
     * quem jogou, o que aconteceu (texto do registro e tipos de evento) e as somas depois da jogada.
     * @param {object|null} jogada Jogada aplicada, ou null para acontecimentos de fora das regras (truco).
     * @param {object[]} eventos Eventos emitidos, ou `[{ tipo }]` para o truco.

    anotarNaLinhaDoTempo(jogada, eventos, texto) {
      const mao = this.mao;
      const novas = mao.registro.slice(this.linhasRegistradas || 0);
      this.linhasRegistradas = mao.registro.length;
      const tipos = eventos.map((e) => e.tipo).filter((t) => t !== "fim");
      if (jogada && jogada.tipo === "inicio" && !tipos.includes("inicio")) return;
      this.linhaDoTempo.push({
        numero: this.linhaDoTempo.length + 1,
        jogador: jogada ? jogada.jogador : eventos[0].jogador,
        tipo: jogada ? jogada.tipo : eventos[0].tipo,
        eventos: tipos,
        texto: texto || novas.join(" "),
        somas: this.pontuacoes.map((p) => p.total)
      });
    },
    /** Fase de início: oponentes escolhem a carta; humanos escolhem um de cada vez. */
    avancarNoInicio() {
      const mao = this.mao;
      mao.jogadores.forEach((jogador, j) => {
        if (jogador.tipo === "oponente" && !jogador.cartaInicial) aplicarJogada(mao, escolherJogada(mao, j));
      });
      const esperando = mao.jogadores.findIndex((jogador) => jogador.tipo === "humano" && !jogador.cartaInicial);
      if (esperando < 0) {
        const eventos = mao.eventos.splice(0);
        this.redesenhar();
        this.time.delayedCall(this.animarEventos(eventos), () => this.avancar());
        return;
      }
      const comecar = () => {
        this.quemVe = esperando;
        this.modo = "inicio";
        this.ocupada = false;
        this.redesenhar();
      };
      const alguemEscolheu = mao.jogadores.some((jogador) => !!jogador.cartaInicial);

      comecar();
    },
    /** Modo de dois jogadores: esconde a mão e pede para passar o aparelho. */
    passarAparelho(j, continuar) {
      this.quemVe = -1;

      this.redesenhar();
      confirmar("Vez de " + this.mao.jogadores[j].nome, "Passe o aparelho. A m\xE3o fica escondida at\xE9 voc\xEA confirmar.", [

    },
    /**

     */
    vezDoOponente() {
      const mao = this.mao, vez = mao.vez, perfil = mao.jogadores[vez].oponente;
      this.ocupada = true;
      this.notaDoOponente = perfil === "montecarlo" ? "simulando partidas\u2026" : "pensando\u2026";
      this.redesenhar();
      this.time.delayedCall(perfil === "montecarlo" ? 350 : 650, () => {
        if (this.encerrada || mao !== this.mao) return;
        this.notaDoOponente = null;
        if (this.trucoConsideradoNoTurno !== mao.turno && podeTrucar(this.partida, vez)) {
          this.trucoConsideradoNoTurno = mao.turno;
          if (querTrucar(mao, vez, perfil)) return this.anunciarTruco(vez);
        }
        const jogada = escolherJogada(mao, vez);
        if (jogada.simulacao) {
          const s = jogada.simulacao;
          this.notaDoOponente = "simulou " + s.partidas + " partidas \xB7 " + Math.round(s.taxaDeVitoria * 100) + "% de vit\xF3ria";
          this.avisarVerbete("montecarlo");
          delete jogada.simulacao;
        }
        this.executarJogada(jogada);
      });
    }
  };

  // src/cenas/mesa/truco.js
  var metodosDoTruco = {
    /** Botão TRUCO! do jogador humano. */
    pedirTrucoHumano() {
      if (!this.ehVezDoHumano() || !podeTrucar(this.partida, this.quemVe)) return;
      this.anunciarTruco(this.quemVe);
    },
    /** Registra o pedido de `j`, grita na tela e pergunta a resposta ao outro jogador. */
    anunciarTruco(j) {
      pedirTruco(this.partida, j);
      this.impactoDoTruco(this.partida.pedido.para);
      this.avisarVerbete("truco");
      this.faixa(GRITO_TRUCO[this.partida.pedido.para], COR_JOGADOR_CSS[j], 72);
      if (this.mao.jogadores[j].tipo === "oponente") this.falar(provocar("truco"));
      this.anotarNaLinhaDoTempo(null, [{ tipo: "truco", jogador: j }], this.mao.jogadores[j].nome + " pediu " + GRITO_TRUCO[this.partida.pedido.para].replace("!", "") + ".");
      this.ocupada = true;
      this.redesenhar();
      this.time.delayedCall(900, () => this.pedirResposta());
    },
    /** Pergunta a resposta a quem recebeu o pedido. */
    pedirResposta() {
      const partida = this.partida, pedido = partida.pedido;
      const quem = 1 - pedido.por;
      const jogador = this.mao.jogadores[quem];
      const podeAumentar = proximoValor(pedido.para) != null;
      if (jogador.tipo === "oponente") {
        const resposta = responderAoTruco(this.mao, quem, jogador.oponente, pedido.para, podeAumentar);
        this.falar(provocar(resposta));
        return this.aplicarResposta(quem, resposta);
      }
      const quemPediu = this.mao.jogadores[pedido.por].nome;
      const botoes = [
        /* quem corre entrega o valor atual da mão */
        { rotulo: "Correr (Perde " + partida.valor + ")", classe: "discreto", acao: () => this.aplicarResposta(quem, "correr") },
        { rotulo: "Desce! (vale " + pedido.para + ")", classe: "vinho", acao: () => this.aplicarResposta(quem, "aceitar") }
      ];
      if (podeAumentar) botoes.push({ rotulo: "Pedir " + GRITO_TRUCO[proximoValor(pedido.para)], acao: () => this.aplicarResposta(quem, "aumentar") });
      confirmar(
        GRITO_TRUCO[pedido.para],
        escaparHtml((this.doisHumanos ? jogador.nome + ", responda. " : "") + "Se aceitar, a m\xE3o vale " + pedido.para + " tentos. Se correr, " + quemPediu + " leva " + partida.valor + " agora.") + this.dicaDaRespostaAoTruco(quem),
        botoes,
        { grito: true, topo: '<div class="quem">' + escaparHtml(quemPediu) + " pediu</div>" }
      );
    },
    /**
     * Aplica a resposta de `quem`.
     * @param {'aceitar'|'correr'|'aumentar'} resposta
     */
    aplicarResposta(quem, resposta) {
      const resultado = responderTruco(this.partida, quem, resposta);
      const nome = this.mao.jogadores[quem].nome;
      const texto = { correr: nome + " correu do truco.", aceitar: nome + " aceitou: a m\xE3o vale " + this.partida.valor + ".", aumentar: nome + " pediu mais." }[resposta];
      this.anotarNaLinhaDoTempo(null, [{ tipo: "truco", jogador: quem }], texto);
      if (resposta === "correr") {
        this.faixa(this.mao.jogadores[quem].nome + " correu!", "#efe3c6", 40);
        if (this.mao.jogadores[quem].tipo === "oponente") this.oponenteCorreu = true;
        this.time.delayedCall(900, () => this.encerrarMao(resultado));
        return;
      }
      if (resposta === "aumentar") {
        this.impactoDoTruco(this.partida.pedido.para);
        this.faixa(GRITO_TRUCO[this.partida.pedido.para], COR_JOGADOR_CSS[quem], 72);
        this.redesenhar();
        this.time.delayedCall(900, () => this.pedirResposta());
        return;
      }
      this.textoFlutuante(610, 300, "Aceito: m\xE3o vale " + this.partida.valor, "#f6dc8f", 26);
      this.redesenhar();
      this.time.delayedCall(600, () => {
        this.ocupada = false;
        this.avancar();
      });
    }
  };

  // src/cenas/mesa/efeitos.js
  var ATAQUES = {
    overfit: { cor: 16753226, titulo: "OVERFIT!" },
    earlystop: { cor: 16731486, titulo: "EARLY STOP!" },
    stackoverflow: { cor: 16731602, titulo: "STACK OVERFLOW!" }

  var corCss = (cor) => "#" + cor.toString(16).padStart(6, "0");
  var metodosDeEfeitos = {
    /** Centro do neurônio na tela. */
    posicaoDoNeuronio(id) {

    },
    /** Ponto de onde saem as cartas jogadas por `j` (a mão de baixo ou a de cima). */
    origemDasCartas(j) {

    },
    /**
     * Anima uma lista de eventos das regras.
     * @param {object[]} eventos

     * @returns {number} Milissegundos até as animações terminarem.
     */
    animarEventos(eventos, jogada) {
      let espera = 350;
      for (const evento of eventos) {
        const animar = this["animar_" + evento.tipo];
        if (animar) espera = Math.max(espera, animar.call(this, evento, jogada) || 0);

    /** Neurônio revelado: gira a carta e mostra os pontos ganhos. */
    animar_ativacao(evento) {

      const imagem = this.visuais[evento.neuronio].imagem;
      imagem.scaleX = 0;
      this.tweens.add({ targets: imagem, scaleX: imagem.escalaBaseX, duration: 200, ease: "Sine.out" });
      Som.virarCarta();
      const { x, y } = this.posicaoDoNeuronio(evento.neuronio);
      const pontuado = this.pontuacoes[evento.jogador].neuronios.find((n) => n.neuronio.id === evento.neuronio);
      this.textoFlutuante(x, y - 50, "+" + (pontuado ? pontuado.pontos : 0), COR_JOGADOR_CSS[evento.jogador], 22);
      this.inspecionar(texturaDeInspecao(this, evento.carta, baralho), mao.jogadores[evento.jogador].nome + " ativou " + nomeDaCarta(evento.carta, baralho) + ".");
      this.avisarVerbete("neuronio");
      const tamanho = mao.jogadores[evento.jogador].caminho.length;

    /** Tunagem: cartas voam para o neurônio e somam pontos. */
    animar_tunagem(evento) {

      const origem = this.origemDasCartas(evento.jogador);
      evento.cartas.forEach((c, i) => this.voarCarta(c, origem.x, origem.y, x, y, i * 120));
      const soma = evento.cartas.reduce((t, c) => t + (ehFigura(c) ? 10 : pontosDaCarta(c, baralho)), 0);
      this.time.delayedCall(320, () => {
        Som.tunagem();
        this.textoFlutuante(x, y - 50, "Tunagem +" + soma, "#7fe08a", 20);

    },
    /** Ataques (overfit, early stop, stack overflow): cartas voam, o neurônio treme e some. */
    animar_ataque(evento, jogada) {
      const mao = this.mao, baralho = mao.config.baralho;
      const { x, y } = this.posicaoDoNeuronio(evento.neuronio);
      const origem = this.origemDasCartas(evento.jogador);
      const jogadas = jogada && jogada.cartas ? jogada.cartas.length : 1;
      for (let k = 0; k < jogadas; k++) {

        if (carta) this.voarCarta(carta, origem.x, origem.y, x, y, k * 110);
      }
      const fantasma = this.add.image(x, y, texturaDaCartaNaMesa(this, evento.cartas[0], baralho)).setDisplaySize(TAMANHO_CARTA.mesaL, TAMANHO_CARTA.mesaA).setDepth(15);
      this.tweens.add({ targets: fantasma, x: "+=6", yoyo: true, repeat: 4, duration: 50, delay: 300 });
      this.tweens.add({
        targets: fantasma,
        alpha: 0,
        displayWidth: TAMANHO_CARTA.mesaL * 1.5,
        displayHeight: TAMANHO_CARTA.mesaA * 1.5,
        angle: 25,
        duration: 500,
        delay: 560,
        onComplete: () => fantasma.destroy()
      });
      const { cor, titulo } = ATAQUES[evento.tipo];
      const explosao = evento.tipo === "stackoverflow";

        this.explodir(x, y, cor, explosao ? 50 : 26);

          Som.explosao();
          this.cameras.main.shake(450, 0.012);
        } else {
          Som.golpe();

        else if (mao.jogadores[evento.dono].tipo === "oponente") this.falar(provocar(evento.tipo === "overfit" ? "sofreuOverfit" : "sofreuParada"));

    /** Baralho Power BI: as cartas da mão foram trocadas. */
    animar_powerbi(evento) {

    /** Alguém passou a vez. */
    animar_passe(evento) {

    },
    /** Quem começa: mostra as cartas reveladas (ou anuncia o sorteio). */
    animar_inicio(evento) {
      const mao = this.mao, baralho = mao.config.baralho;

      if (!evento.cartas) {

    },
    /** Avisa quando uma rede acaba de formar uma quadra de figuras (vanishing gradient). */
    verificarVanishing() {

    /* ------------------------------------------------------------------ efeitos básicos */
    /** Uma carta voa de (x0, y0) até (x1, y1) e some. */
    voarCarta(carta, x0, y0, x1, y1, atraso = 0) {

      this.tweens.add({
        targets: imagem,
        x: x1 + 8,
        y: y1 - 8,
        displayWidth: TAMANHO_CARTA.mesaL,
        displayHeight: TAMANHO_CARTA.mesaA,

    /** Explosão de `quantidade` faíscas da cor dada. A faísca colorida é uma textura própria (Canvas não tem tint). */
    explodir(x, y, cor, quantidade) {

      if (partida.alvo <= 1) agora = "Agora: partida de m\xE3o \xFAnica, sem truco.";
      else if (ehMaoDeOnze(partida)) agora = "Agora: m\xE3o de onze, ningu\xE9m pode trucar.";
      else if (!minhaVez || !podeTrucar(partida, eu)) agora = "Agora: indispon\xEDvel (n\xE3o \xE9 sua vez ou voc\xEA foi o \xFAltimo a aumentar).";
      else {
        const chance = Math.round(chanceDeVitoria(mao, eu, SIMULACOES_DA_DICA) * 100);
        agora = "Agora: sua chance estimada de vencer esta m\xE3o \xE9 " + chance + "% (" + SIMULACOES_DA_DICA + " simula\xE7\xF5es de Monte Carlo). " + (chance >= 65 ? "Bom momento para pedir " + GRITO_TRUCO[proximo] : chance >= 40 ? "Arriscado: s\xF3 como blefe." : "Melhor n\xE3o trucar agora.");
      }
      return {
        titulo: "Grim\xF3rio \xB7 Truco",
        corpo: "Aumenta o valor da m\xE3o: 1 \u2192 3 \u2192 6 \u2192 9 \u2192 12 tentos. Quem recebe o pedido aceita, corre (e entrega o valor atual) ou pede mais.",
        agora,
        conceito: conceitoCurto("truco")
      };
    },
    /** Linha com a chance estimada, para a caixa de resposta ao truco (só com dicas ligadas). */
    dicaDaRespostaAoTruco(quem) {
      if (!this.app.dicasLigadas || this.mao.jogadores[quem].tipo !== "humano") return "";
      const chance = Math.round(chanceDeVitoria(this.mao, quem, SIMULACOES_DA_DICA) * 100);
      const conselho = chance >= 70 ? "d\xE1 para aceitar e at\xE9 pedir mais." : chance >= 35 ? "aceitar \xE9 razo\xE1vel." : "correr limita o preju\xEDzo.";
      return "<br><br><b>Dica:</b> sua chance estimada de vencer esta m\xE3o \xE9 " + chance + "% (" + SIMULACOES_DA_DICA + " simula\xE7\xF5es); " + conselho;
    }
  };

  // src/cenas/mesa/CenaMesa.js
  var CenaMesa = class extends Phaser.Scene {
    constructor() {
      super("Mesa");
    }
    /** Monta a mesa e começa a primeira mão (depois das regras, na primeira visita). */
    create() {
      this.app = Aplicacao;
      this.opcoes = { ...this.app.opcoes };
      this.doisHumanos = this.opcoes.oponente === "doisHumanos";
      this.partida = novaPartida(this.opcoes.alvo);
      this.mao = null;
      ajustarCamera(this);
      colocarFundo(this, this.opcoes.terreno);
      this.desenharCenarioFixo();
      this.camadaVazios = this.add.graphics().setDepth(1);
      this.camadaConexoes = this.add.graphics().setDepth(2);
      this.camadaDestaques = this.add.graphics().setDepth(5);
      this.camadaCurva = this.add.graphics().setDepth(6);
      this.camadaVez = this.add.graphics().setDepth(6);
      this.camadaSelecao = this.add.graphics().setDepth(11);
      this.criarPaineis();
      this.input.keyboard?.on("keydown-ESC", () => this.cancelarSelecao());
      this.events.once("shutdown", () => {
        this.encerrada = true;
        esconderDicaFlutuante();
        Musica.parar();
      });
      this.historicoDaPartida = [];
      if (this.app.progresso.musica) Musica.tocar(this.opcoes.terreno);
      const comecar = () => this.iniciarMao();
      if (!this.app.progresso.tutorialVisto) abrirRegras(this.app, comecar);
      else comecar();
    }
    /** A cada quadro: conexões animadas, contornos pulsantes e o destaque de quem está na vez. */
    update(tempo) {
      if (!this.mao) return;
      this.desenharConexoesEAlvos(tempo);
      this.desenharDestaqueDaVez(tempo);
    }
  };
  Object.assign(
    CenaMesa.prototype,
    metodosDoCenario,
    metodosDeDesenho,
    metodosDeEntrada,
    metodosDeTurnos,
    metodosDoTruco,
    metodosDeEfeitos,
    metodosDoResultado,
    metodosDeDicas
  );

  // src/principal.js
  var celularEmPe = globalThis.matchMedia ? matchMedia("(orientation: portrait) and (max-width: 600px)") : null;
  var TOQUES_SIMULTANEOS = 4;
  function remedirAposMudarATela() {
    for (const espera of [50, 250, 600, 1200]) {
      setTimeout(() => {
        if (Aplicacao.jogo) Aplicacao.jogo.scale.refresh();
      }, espera);
    }
  }
  function criarJogo() {
    Aplicacao.jogo = new Phaser.Game({
      type: FORCAR_CANVAS ? Phaser.CANVAS : Phaser.AUTO,
      parent: "jogo",
      width: Math.round(MUNDO.largura * RESOLUCAO),
      height: Math.round(MUNDO.altura * RESOLUCAO),
      backgroundColor: "#06180f",
      scale: { mode: Phaser.Scale.EXPAND, autoCenter: Phaser.Scale.CENTER_BOTH },
      render: { antialias: true, roundPixels: false },
      /* cliques nos painéis HTML não vazam para o canvas. Vários toques simultâneos: em tela cheia
       * o polegar que segura o celular costuma encostar na borda da tela, e com um só ponteiro
       * de toque o Phaser ignorava o toque seguinte (nos botões de ação). */
      input: { windowEvents: false, activePointers: TOQUES_SIMULTANEOS },
      scene: [CenaCarregamento, CenaMenu, CenaMesa]
    });
    document.addEventListener("fullscreenchange", remedirAposMudarATela);
    document.addEventListener("webkitfullscreenchange", remedirAposMudarATela);
    globalThis.screen?.orientation?.addEventListener?.("change", remedirAposMudarATela);
  }
  function iniciarJogo() {
    if (Aplicacao.jogo) return;
    if (!celularEmPe || !celularEmPe.matches) return criarJogo();
    const aoGirar = () => {
      if (celularEmPe.matches) return;
      removeEventListener("resize", aoGirar);
      removeEventListener("orientationchange", aoGirar);
      setTimeout(iniciarJogo, 150);
    };
    addEventListener("resize", aoGirar);
    addEventListener("orientationchange", aoGirar);
  }
  prepararTextoNitido();
  Aplicacao.iniciar();
  iniciarJogo();
  globalThis.__TRUCO_DE_TURING__ = Aplicacao;
})();

</script>
